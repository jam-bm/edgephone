name: Bug report
description: Something doesn't work on your phone
labels: [bug]
body:
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Samsung Galaxy A30, Android 11 (One UI 3.1)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: edgephone version
      description: Output of `edgephone version`
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: edgephone doctor output
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "`edgephone logs <service>` or ~/.local/state/edgephone/agent.log"
      render: text
